# arrStack — rootless Docker sandbox
#
# IMPORTANT (PUID/PGID convention):
# Under rootless Docker, container UID 0 maps to the host `arrstack` user via
# the userns mapping. We set PUID=0 / PGID=0 (or `user: "0:0"` / PLEX_UID=0)
# in every service so that files written into bind mounts come out owned by
# `arrstack:arrstack` on the host. This *inverts* the usual lscr.io
# convention of PUID=1000 — do not change without understanding the userns
# implications.

networks:
  arrstack_network:
    external: false

services:
  #---------------------------------------------------------------------------
  # TRANSMISSION
  #---------------------------------------------------------------------------
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/transmission:/config
      - ${ARR1_ROOT}/downloads:/downloads
    networks:
      - arrstack_network
    ports:
      - ${TRANSMISSION_PORT}:9091
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # RADARR
  #---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/radarr:/config
      - ${ARR1_ROOT}/media/movies:/movies
      - ${ARR1_ROOT}/media/movies_4k:/movies_4k
      - ${ARR2_ROOT}/media/movies:/movies2
      - ${ARR1_ROOT}/downloads:/downloads
    networks:
      - arrstack_network
    ports:
      - ${RADARR_PORT}:7878
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # SONARR
  #---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/sonarr:/config
      - ${ARR1_ROOT}/media/series:/series
      - ${ARR1_ROOT}/downloads:/downloads
    networks:
      - arrstack_network
    ports:
      - ${SONARR_PORT}:8989
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # BAZARR
  #---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/bazarr:/config
      - ${ARR1_ROOT}/media:/media
      - ${ARR2_ROOT}/media:/media2
    networks:
      - arrstack_network
    ports:
      - ${BAZARR_PORT}:6767
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # PROWLARR
  #---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/prowlarr:/config
    networks:
      - arrstack_network
    ports:
      - ${PROWLARR_PORT}:9696
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # SEERR (Overseerr fork)
  #---------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: "0:0"
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/seerr:/app/config
    networks:
      - arrstack_network
    ports:
      - ${SEERR_PORT}:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # PLEX (official image; PLEX_UID=0 maps container plex user → host arrstack
  # under rootless Docker, so config files come out owned correctly)
  #---------------------------------------------------------------------------
  plex:
    image: plexinc/pms-docker
    container_name: plex
    environment:
      - TZ=${TZ}
      - PLEX_UID=0
      - PLEX_GID=0
    volumes:
      - ${ARR1_ROOT}/config/plex:/config
      - ${ARR1_ROOT}/config/plex-transcode:/transcode
      - ${ARR1_ROOT}/media:/media
      - ${ARR2_ROOT}/media/movies:/movies2
    networks:
      - arrstack_network
    ports:
      - 32400:32400/tcp     # Plex Web / API (required)
      - 3005:3005/tcp       # Plex Companion (legacy clients)
      - 8324:8324/tcp       # Plex for Roku Companion (legacy)
      - 32469:32469/tcp     # DLNA server (kept for completeness; without 1900 it is effectively unused)
      - 32410:32410/udp     # Plex GDM discovery — these four are how LAN clients find Plex without account sign-in
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      # 1900/udp (DLNA SSDP) intentionally NOT bound — Spotify's desktop client
      # holds UDP 1900 for Spotify Connect device discovery. Plex's DLNA feature
      # is unused with our Shield + Plex.tv setup, so we drop the port to avoid
      # the conflict. If you need DLNA later, quit Spotify and re-add the port.
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # CADDY (Phase 2.1: TLS termination + reverse proxy for public Plex access)
  # Host port 8443 → container 443 because the ISP router reserves port 443
  # entirely (admin UI). Public URL is therefore https://domain:8443.
  #---------------------------------------------------------------------------
  caddy:
    build: ./caddy        # custom build with caddy-dns/cloudflare plugin (DNS-01)
    container_name: caddy
    volumes:
      # Caddyfile lives in the deploy dir alongside the Dockerfile (relative
      # path resolves to <compose-dir>/caddy/Caddyfile = /srv/arrstack/stack/caddy/Caddyfile).
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Runtime state (cert storage, auto-generated config) lives on drive 1
      # like every other service's per-app dir.
      - ${ARR1_ROOT}/config/caddy/data:/data
      - ${ARR1_ROOT}/config/caddy/config:/config
    environment:
      - PLEX_HOSTNAME=${PLEX_HOSTNAME}
      - CF_API_TOKEN=${CF_API_TOKEN}     # used by caddy-dns/cloudflare for DNS-01
    networks:
      - arrstack_network
    ports:
      - 8443:443
      - 8443:443/udp     # HTTP/3 (QUIC); harmless even if unused
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # CLOUDFLARE DDNS (Phase 2.1: keeps the public A record in sync with the
  # home dynamic IPv4 every 5 minutes via the Cloudflare API.)
  #---------------------------------------------------------------------------
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    environment:
      - CLOUDFLARE_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${PLEX_HOSTNAME}
      - IP4_PROVIDER=cloudflare.trace
      - IP6_PROVIDER=none
      - PROXIED=false
      - UPDATE_CRON=*/5 * * * *
      - TZ=${TZ}
    networks:
      - arrstack_network
    read_only: true
    cap_drop:
      - all
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # TAUTULLI (host dir keeps the existing `tatulli` typo so the migrated DB
  # resolves cleanly; container-side path is `/config` regardless)
  #---------------------------------------------------------------------------
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/tatulli:/config
    networks:
      - arrstack_network
    ports:
      - ${TAUTULLI_PORT}:8181
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # HOMEPAGE (LAN dashboard; configured post-boot)
  #---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${ARR1_ROOT}/config/homepage:/app/config
    networks:
      - arrstack_network
    ports:
      - ${HOMEPAGE_PORT}:3000
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # FLARESOLVERR (Cloudflare-challenge solver for Prowlarr; stateless)
  #---------------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    networks:
      - arrstack_network
    ports:
      - ${FLARESOLVERR_PORT}:8191
    restart: unless-stopped

  #---------------------------------------------------------------------------
  # CLOUDFLARED (Phase 2.2: CF Tunnel for public Seerr access via Plex SSO.
  # Tunnel hostname configured in CF Zero Trust dashboard, not here.)
  #---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - arrstack_network
    restart: unless-stopped
